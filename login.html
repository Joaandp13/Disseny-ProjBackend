<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · Archons Posts</title>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Orbitron:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                colors: {
                    bg: "#10152A", panel: "#262D52", alt: "#323A6E", head: "#1A2040",
                    field: "#343C73", gold: "#EBB74A", muted: "#A7B0DC", amber: "#8A5B25", pill: "#D3D4DA"
                },
                fontFamily: { main: ["Lilita One", "sans-serif"], logo: ["Orbitron", "sans-serif"] }
            } }
        }
    </script>
</head>
<body class="bg-bg text-white font-main min-h-screen flex flex-col items-center justify-center gap-6 p-6">

    <a href="index.html" class="flex items-center gap-3 text-gold">
        <span aria-hidden="true" class="block w-8 h-9 bg-gold" style="-webkit-mask: url('assets/icons/alien-icon.svg') center / contain no-repeat; mask: url('assets/icons/alien-icon.svg') center / contain no-repeat;"></span>
        <span class="font-logo text-2xl tracking-wider">ARCHONS POSTS</span>
    </a>

    <section class="w-full max-w-5xl grid md:grid-cols-2 bg-panel border border-[#323a6b] rounded-lg overflow-hidden shadow-2xl shadow-black/20">

        <!-- Izquierda -->
        <aside class="flex flex-col items-center justify-center text-center p-10 md:p-14 bg-gradient-to-br from-[#12172E] via-panel to-amber">
            <img src="assets/icons/paimon_login.png" alt="Paimon" class="w-48 md:w-56 mb-6">
            <h2 class="text-2xl mb-4">Welcome back, Traveler</h2>
            <p class="text-base text-muted">Share your builds, and find the best<br>team for your companions</p>
        </aside>

        <!-- Derecha -->
        <div class="flex flex-col p-10 md:px-14 md:py-16">
            <h1 class="text-3xl text-gold mb-5">Log in</h1>

            <form action="#">
                  <label for="user" class="block mt-3 mb-2 ml-1 text-base text-gold">Username or Email</label>
                <input id="user" type="text" placeholder="Pepita de los palotes"
                      class="w-full h-12 px-5 text-sm text-white placeholder:text-muted bg-field border border-gold rounded-full outline-none focus:ring-2 focus:ring-gold/50">

                  <label for="pass" class="block mt-5 mb-2 ml-1 text-base text-gold">Password</label>
                <div class="relative">
                    <input id="pass" type="password" placeholder="••••••••••••••"
                          class="w-full h-12 pl-5 pr-12 text-sm text-white placeholder:text-muted bg-field border border-gold rounded-full outline-none focus:ring-2 focus:ring-gold/50">
                      <button type="button" aria-label="Show password" class="absolute right-4 top-1/2 -translate-y-1/2 text-muted">
                       <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>

                <div class="flex items-center justify-between mt-5 mb-8 text-sm">
                    <label class="flex items-center gap-1.5 text-muted cursor-pointer">
                        <input type="checkbox" class="accent-gold"> Remember me
                    </label>
                    <a href="#" class="text-gold hover:underline">Forgot password?</a>
                </div>

                <button type="submit" class="w-full h-12 text-base text-[#1B1B33] bg-gold rounded-full hover:brightness-110">LOG IN</button>
            </form>

            <p class="my-6 text-base text-center text-muted">or</p>

            <div class="flex gap-3">
                <a href="#" aria-label="Google" class="flex-1 h-11 grid place-items-center text-muted border border-gold rounded-full hover:bg-gold/10 hover:text-gold">
                    <img src="assets/icons/google_logo.svg" alt="" class="w-5 h-5">
                </a>
                <a href="#" aria-label="Reddit" class="flex-1 h-11 grid place-items-center text-muted border border-gold rounded-full hover:bg-gold/10 hover:text-gold">
                    <img src="assets/icons/reddit_logo.svg" alt="" class="w-5 h-5">
                </a>
                <a href="#" aria-label="Discord" class="flex-1 h-11 grid place-items-center text-muted border border-gold rounded-full hover:bg-gold/10 hover:text-gold">
                    <img src="assets/icons/discord_logo.svg" alt="" class="w-5 h-5">
                </a>
                <a href="#" aria-label="X" class="flex-1 h-11 grid place-items-center text-muted border border-gold rounded-full hover:bg-gold/10 hover:text-gold">
                    <img src="assets/icons/x_logo.svg" alt="" class="w-4 h-4">
                </a>
            </div>

            <p class="mt-6 text-sm text-center text-muted">New around here? <a href="#" class="text-gold hover:underline">Create an account</a></p>
        </div>
    </section>
</body>
</html>
